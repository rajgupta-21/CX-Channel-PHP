<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CX Channel – Team Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--blue:#00538F;--blue2:#00447A;--red:#ED3059;--ink:#222222;--muted:#5b6b7c;--line:#E2E8EE}
    body{font-family:Inter,sans-serif;background:#FBECD7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .wrap{width:100%;max-width:440px;}
    .logo-row{text-align:center;margin-bottom:24px;}
    .logo-icon{width:60px;height:60px;background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 18px rgba(0,83,143,.28);}
    .logo-name{color:var(--blue2);font-size:26px;font-weight:800;}
    .logo-sub{color:var(--muted);font-size:13px;margin-top:4px;}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 18px 50px rgba(0,40,80,.14);}
    .card-title{color:var(--ink);font-size:22px;font-weight:800;margin-bottom:6px;}
    .card-sub{color:var(--muted);font-size:14px;margin-bottom:24px;line-height:1.5;}
    label{font-size:12px;font-weight:700;color:var(--ink);display:block;margin-bottom:7px;}
    .input-wrap{position:relative;margin-bottom:16px;}
    input{width:100%;background:#fff;border:1.5px solid #CACACA;color:var(--ink);border-radius:10px;padding:13px 14px;font:inherit;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,83,143,.12);}
    input::placeholder{color:#98a6b4;}
    .eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#709EC0;font-size:18px;padding:4px;transition:color .2s;line-height:1;}
    .eye-btn:hover{color:var(--blue);}
    .has-eye input{padding-right:44px;}
    .btn-submit{width:100%;background:linear-gradient(135deg,var(--red),#C81E45);color:#fff;border:none;border-radius:10px;padding:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px;transition:.2s;box-shadow:0 6px 18px rgba(237,48,89,.25);}
    .btn-submit:hover{opacity:.94}
    .btn-submit:disabled{opacity:.7;cursor:not-allowed;}
    .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:8px;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .alert-error{display:none;padding:12px 14px;border-radius:10px;background:#FDECEC;border:1px solid #F7C8D2;color:#C81E45;font-size:13px;font-weight:600;margin-bottom:16px;}
    .alert-error.show{display:flex;align-items:center;gap:8px;}
    .divider{border:none;border-top:1px solid var(--line);margin:22px 0;}
    .links{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
    .link-text{color:var(--muted);font-size:13px;}
    .link-btn{color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;transition:color .2s;}
    .link-btn:hover{color:var(--red);}
    .team-badge{text-align:center;margin-top:20px;color:var(--muted);font-size:12px;}
    .team-badge a{color:var(--blue);text-decoration:none;font-weight:700;}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <div class="logo-icon">📡</div>
    <div class="logo-name">CX Channel</div>
    <div class="logo-sub">Team Dashboard Access</div>
  </div>
  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to access the approval dashboard and manage requests.</div>
    <div id="errBox" class="alert-error"><span>⚠</span><span id="errMsg">Invalid username or password.</span></div>
    <label>Username</label>
    <div class="input-wrap">
      <input id="uUser" type="text" placeholder="Enter your username" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <label>Password</label>
    <div class="input-wrap has-eye">
      <input id="uPass" type="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
      <button class="eye-btn" onclick="togglePass('uPass','eye1')" aria-label="Toggle password visibility"><span id="eye1">👁</span></button>
    </div>
    <button class="btn-submit" id="loginBtn" onclick="doLogin()">Sign In →</button>
    <hr class="divider"/>
    <div class="links">
      <span class="link-text">New team members are created by an administrator.</span>
    </div>
  </div>
  <div class="team-badge">Customer? <a href="customer.html">Use the Customer Portal →</a></div>
</div>
<script>
  const API = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '');
  if(localStorage.getItem('cxUser')) window.location.href="index.html";
  function togglePass(inputId,iconId){
    const inp=document.getElementById(inputId),ico=document.getElementById(iconId);
    inp.type=inp.type==="password"?"text":"password";
    ico.textContent=inp.type==="password"?"👁":"🙈";
  }
  async function doLogin(){
    const errBox=document.getElementById("errBox"),errMsg=document.getElementById("errMsg");
    errBox.classList.remove("show");
    const username=document.getElementById("uUser").value.trim();
    const password=document.getElementById("uPass").value.trim();
    if(!username||!password){errMsg.textContent="Please enter your username and password.";errBox.classList.add("show");return;}
    const loginBtn=document.getElementById("loginBtn");
    loginBtn.disabled=true;
    loginBtn.innerHTML='<span class="spinner"></span>Signing In…';
    try{
      const res=await fetch(`${API}/api/auth/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
      const data=await res.json();
      if(!res.ok){loginBtn.disabled=false;loginBtn.textContent="Sign In →";errMsg.textContent=data.message||"Invalid username or password.";errBox.classList.add("show");return;}
      localStorage.setItem('cxUser',JSON.stringify(data));
      window.location.href="index.html";
    }catch{loginBtn.disabled=false;loginBtn.textContent="Sign In →";errMsg.textContent="Could not connect to server. Please try again.";errBox.classList.add("show");}
  }
</script>
</body>
</html>
