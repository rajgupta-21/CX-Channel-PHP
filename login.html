<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fastech — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--blue:#00538F;--blue2:#00447A;--red:#ED3059;--ink:#222222;--muted:#5b6b7c;--line:#E2E8EE}
    body{min-height:100vh;font-family:Inter,sans-serif;color:var(--ink);background:#FBECD7;display:grid;place-items:center;padding:20px}
    .card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,40,80,.14);overflow:hidden}
    .topbar{background:linear-gradient(135deg,var(--blue),var(--blue2));padding:22px 28px;display:flex;align-items:center;gap:12px}
    .logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:22px}
    .topbar h1{font-size:19px;font-weight:800;color:#fff;line-height:1}
    .topbar p{font-size:11px;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.16em;margin-top:3px}
    .body{padding:28px}
    h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
    .sub{color:var(--muted);margin-bottom:20px;line-height:1.6}
    .field{margin-bottom:14px}
    label{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--ink);margin-bottom:8px}
    input{width:100%;height:48px;border-radius:10px;border:1px solid #CACACA;background:#fff;color:var(--ink);padding:0 14px;outline:none;font:inherit;font-size:14px}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,83,143,.12)}
    .password-wrap{position:relative}.password-wrap input{padding-right:48px}
    .toggle{position:absolute;top:50%;right:12px;transform:translateY(-50%);border:none;background:transparent;color:#709EC0;cursor:pointer;font-size:16px}
    .alert{display:none;margin-bottom:14px;padding:12px 14px;border-radius:10px;font-weight:700;font-size:13px}
    .alert.show{display:block}.alert.error{background:#FDECEC;color:#C81E45;border:1px solid #F7C8D2}.alert.success{background:#EAF7EF;color:#1f7a44;border:1px solid #BFE3CE}
    .btn{width:100%;height:50px;border:none;border-radius:10px;cursor:pointer;font:inherit;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--red),#C81E45);box-shadow:0 8px 20px rgba(237,48,89,.28);margin-top:6px}
    .btn:hover{opacity:.94}.btn:disabled{opacity:.7;cursor:not-allowed}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:8px;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .links{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
    .links a{color:var(--blue);text-decoration:none;font-weight:700}.links a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="topbar">
      <div class="logo">🛰️</div>
      <div><h1>Fastech</h1><p>Service Portal</p></div>
    </div>

    <div class="body">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to your team account to continue.</p>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm">
        <div class="field"><label for="username">Username</label><input id="username" type="text" placeholder="Enter your username" required /></div>
        <div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" placeholder="Enter your password" required /><button class="toggle" type="button" id="toggleBtn">👁</button></div></div>
        <button class="btn" type="submit" id="loginBtn">Sign In</button>
      </form>

      <div class="links">
        <span>Raise a request? <a href="customer.html">Open customer portal</a></span>
      </div>
    </div>
  </div>

<script>
  const API = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '');
  const alertBox = document.getElementById('alertBox');
  const form = document.getElementById('loginForm');
  const toggleBtn = document.getElementById('toggleBtn');
  const loginBtn = document.getElementById('loginBtn');

  function setLoading(loading){
    loginBtn.disabled = loading;
    loginBtn.innerHTML = loading
      ? '<span class="spinner"></span>Signing In…'
      : 'Sign In';
  }

  function showAlert(msg, type='error'){
    alertBox.className=`alert show ${type}`;
    alertBox.textContent=msg;
  }

  function hideAlert(){
    alertBox.className='alert';
    alertBox.textContent='';
  }

  toggleBtn.addEventListener('click',()=>{
    const input=document.getElementById('password');
    input.type=input.type==='password'?'text':'password';
  });

  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    hideAlert();

    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value;

    if(!username||!password){
      showAlert('Username and password are required.');
      return;
    }

    try{
      setLoading(true);
      const res=await fetch(`${API}/api/auth/login`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username,password})
      });

      const data=await res.json();
      if(!res.ok){
        setLoading(false);
        showAlert(data.message||'Login failed.');
        return;
      }

      localStorage.setItem('cxUser',JSON.stringify(data));
      window.location.href='index.html';
    }catch(err){
      setLoading(false);
      showAlert('Network error. Please try again.');
    }
  });
</script>
</body>
</html>
