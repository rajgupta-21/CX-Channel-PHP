services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cx_channel
      MYSQL_USER: cx_user
      MYSQL_PASSWORD: cx_pass
    ports:
      - "3307:3306"
    volumes:
      - cx_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://cx_user:cx_pass@mysql:3306/cx_channel
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - cx_uploads:/var/www/html/server/uploads
    command: ["php", "-S", "0.0.0.0:3000", "router.php"]

volumes:
  cx_mysql_data:
  cx_uploads: